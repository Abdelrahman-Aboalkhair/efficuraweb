<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="SOC II, in progress">
  <defs>
    <linearGradient id="soc2-ring" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2662d"/>
      <stop offset="1" stop-color="#a95425"/>
    </linearGradient>
  </defs>
  <!-- progress track (full ring, light) -->
  <circle cx="48" cy="48" r="42" fill="none" stroke="#ece3da" stroke-width="5"/>
  <!-- progress arc: dasharray "<arc> <circumference>"; circumference = 2*pi*42 = 263.9.
       Currently ~60% (158.3). Change the first number to adjust progress. -->
  <circle cx="48" cy="48" r="42" fill="none" stroke="url(#soc2-ring)" stroke-width="5"
          stroke-linecap="round" stroke-dasharray="158.3 263.9"
          transform="rotate(-90 48 48)"/>
  <!-- smaller inner seal -->
  <circle cx="48" cy="48" r="31" fill="#fff" stroke="#f0e6dc" stroke-width="1.5"/>
  <text x="48" y="53" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="0.5"><tspan fill="#1a1a1a">SOC</tspan><tspan fill="#1a1a1a" dx="5">II</tspan></text>
</svg>
